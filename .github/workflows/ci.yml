name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No .py under tests/
        run: |
          if find tests -name '*.py' | grep -q .; then
            echo "Hard-rule violation: .py file under tests/" >&2
            find tests -name '*.py' >&2
            exit 1
          fi

      - name: No pandas/scipy in src/ or tests/
        run: |
          if grep -rE 'pandas\.|scipy\.|import pandas|import scipy' src tests 2>/dev/null; then
            echo "Hard-rule violation: external oracle reference in Chelis source" >&2
            exit 1
          fi

      - name: tests/ contains Chelis-native test files
        run: |
          count=$(find tests -maxdepth 1 -name '*.ch' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Hard-rule violation: tests/*.ch is empty" >&2
            exit 1
          fi
          echo "OK: tests/ contains $count .ch files"

  generate-test-matrix:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: list
        run: |
          files=$(find tests -maxdepth 1 -name '*.ch' -type f \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files" | jq -r '.[]'

  chelis-tests:
    needs: [lint, generate-test-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.generate-test-matrix.outputs.files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.7.3 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.7.3-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.7.3-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.7.3-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.7.3"

      - name: Install released dependencies
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef install --from-github Chelis-Lang/nautilus@v0.7.3

      - name: chelis test ${{ matrix.file }}
        run: chelis test --timeout 600 ${{ matrix.file }}

  chelis-tests-summary:
    needs: chelis-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        run: |
          if [ "${{ needs.chelis-tests.result }}" != "success" ]; then
            echo "chelis-tests matrix failed (result: ${{ needs.chelis-tests.result }})" >&2
            exit 1
          fi
          echo "All chelis-tests matrix entries passed"

  mac-smoke:
    needs: lint
    runs-on: macos-latest
    # Proof-of-life: the Coral reef package builds under the Darwin
    # chelis toolchain. Nothing more. The full test suite runs on
    # Linux; this job only asserts that "the lib works on Mac" so a
    # Darwin chelis regression that breaks Coral surfaces here instead
    # of in an issue from a Mac user weeks later. See docs/RELEASES.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download chelis-darwin-arm64 toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.7.3 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.7.3-darwin-arm64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.7.3-darwin-arm64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.7.3-darwin-arm64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.7.3"

      - name: Build Coral package
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef build

      - name: Coral package is built
        run: test -f dist/coral-0.7.3.chb

  pandas-parity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pandas --quiet

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.7.3 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.7.3-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.7.3-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.7.3-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.7.3"

      - name: Install released dependencies
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef install --from-github Chelis-Lang/nautilus@v0.7.3

      - name: static checks
        run: python scripts/run_static_checks.py

      - name: SKILL examples
        run: python scripts/run_skill_checks.py

      - name: mdBook examples
        run: python scripts/validate_book_examples.py

      - name: pandas parity
        run: python parity/run_parity.py --strict
