[book]
title = "Coral: typed dataframes for Chelis"
authors = ["Chelis contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Chelis-Lang/coral"
edit-url-template = "https://github.com/Chelis-Lang/coral/edit/main/docs/book/src/{path}"
