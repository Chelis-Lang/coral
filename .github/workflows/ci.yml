name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AUTO-SYNC: must match reef.toml. The pin-consistency-guard job
  # below fails immediately if these drift from reef.toml.
  CHELIS_TAG: v0.19.1
  CHELIS_VERSION: 0.19.1
  NAUTILUS_TAG: v0.7.50
  CORAL_VERSION: 0.7.47

jobs:
  pin-consistency-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # conform bump-check diffs pins against origin/main.
          fetch-depth: 0

      # No reef-cache-key: audit/bump-check never touch the reef registry,
      # and joining the shared cache from the fastest job risks saving an
      # empty registry under a fresh key before the real jobs populate it.
      - name: Install chelis toolchain (cached)
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}

      - name: Audit shell conformance and workflow pins
        run: chelis reef conform audit --explain

      - name: Test release workflow contracts
        run: python3 scripts/test_release_workflow.py

      - name: Enforce the pin-bump contract
        run: chelis reef conform bump-check --base origin/main

      - name: Assert CI chelis pin matches reef.toml
        run: |
          set -euo pipefail
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          REEF_VERSION=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml | head -1)
          REEF_NAUTILUS=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          DRIFT=0
          if [ "v${REEF_CHELIS}" != "${{ env.CHELIS_TAG }}" ]; then
            echo "::error::CI pin drift: CHELIS_TAG=${{ env.CHELIS_TAG }} but reef.toml has =${REEF_CHELIS}"
            DRIFT=1
          fi
          if [ "${REEF_VERSION}" != "${{ env.CORAL_VERSION }}" ]; then
            echo "::error::CI pin drift: CORAL_VERSION=${{ env.CORAL_VERSION }} but reef.toml has ${REEF_VERSION}"
            DRIFT=1
          fi
          if [ "v${REEF_NAUTILUS}" != "${{ env.NAUTILUS_TAG }}" ]; then
            echo "::error::CI pin drift: NAUTILUS_TAG=${{ env.NAUTILUS_TAG }} but reef.toml has nautilus ${REEF_NAUTILUS}"
            DRIFT=1
          fi
          [ "$DRIFT" -eq 0 ] && echo "✓ All CI pins match reef.toml"
          exit $DRIFT

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test secret scan contract
        run: python3 -m unittest discover -v -s .github/scripts -p test_secret_scan.py

      - name: No .py under tests/
        run: |
          if find tests -name '*.py' | grep -q .; then
            echo "Hard-rule violation: .py file under tests/" >&2
            find tests -name '*.py' >&2
            exit 1
          fi

      - name: No pandas/scipy in src/ or tests/
        run: |
          if grep -rE 'pandas\.|scipy\.|import pandas|import scipy' src tests 2>/dev/null; then
            echo "Hard-rule violation: external oracle reference in Chelis source" >&2
            exit 1
          fi

      - name: tests/ contains Chelis-native test files
        run: |
          count=$(find tests -maxdepth 1 -name '*.ch' -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Hard-rule violation: tests/*.ch is empty" >&2
            exit 1
          fi
          echo "OK: tests/ contains $count .ch files"

  # The book in docs/book/ mirrors https://chelis.ch/docs/coral/. Its examples
  # compile in the pandas-parity job (scripts/validate_book_examples.py),
  # which reuses that job's toolchain install.
  book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Build mdBook
        run: mdbook build docs/book

      - name: Lint book and README against the writing standard
        run: python3 scripts/check_book.py docs/book/src README.md

  chelis-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef install --from-github "Chelis-Lang/nautilus@${NAUTILUS_TAG}"

      - name: chelis test (node-local parallel)
        run: chelis test tests/ --timeout 600 --jobs auto

      # Shell contract §6: each case must fail with the diagnostic
      # pinned on line 1 of its paired .expect sidecar.
      - name: chelis test (negative contracts)
        run: chelis test tests_neg/ --expect neg

      # Shell contract §5: each probe must still FAIL with the diagnostic on
      # line 1 of its sidecar. A probe that passes is FIX-detected and fails
      # this step loudly, which is how a pin bump learns the blocker is gone.
      - name: chelis test (upstream blocker probes)
        run: chelis test tests_blocked/ --expect blocked

      - name: native float NaN regression
        run: python scripts/repro_native_nan.py

      - name: native full drop remains explicitly blocked
        run: python scripts/repro_native_drop_nan_blocked.py

      - name: native tensor neq preserves IEEE NaN inequality
        run: python scripts/repro_native_neq.py

      - name: native package Frame reads and drop boundary
        run: python scripts/repro_package_frame_build.py --target all

  mac-smoke:
    needs: lint
    runs-on: macos-latest
    # Spend: macOS minutes bill ~10x Linux. Run on push-to-main and
    # workflow_dispatch, not on every PR iteration (the Linux jobs
    # already gate the PR). A Darwin chelis regression still surfaces
    # on the push-to-main run before a release.
    if: ${{ github.event_name != 'pull_request' }}
    # Proof-of-life: the Coral reef package builds under the Darwin
    # chelis toolchain. Nothing more. The full test suite runs on
    # Linux; this job only asserts that "the lib works on Mac" so a
    # Darwin chelis regression that breaks Coral surfaces here instead
    # of in an issue from a Mac user weeks later. See docs/releases.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          platform: darwin-arm64
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef install --from-github "Chelis-Lang/nautilus@${NAUTILUS_TAG}"

      - name: Build Coral package
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef build

      - name: Coral package is built
        run: test -f "dist/coral-${CORAL_VERSION}.chb"

  pandas-parity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install locked parity environment
        run: uv sync --project parity --frozen

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef install --from-github "Chelis-Lang/nautilus@${NAUTILUS_TAG}"

      - name: static checks
        run: python scripts/run_static_checks.py

      - name: parity generator contract
        run: python scripts/test_parity_contract.py

      - name: SKILL examples
        run: python scripts/run_skill_checks.py

      - name: mdBook examples
        run: python scripts/validate_book_examples.py

      - name: pandas parity (validate reviewed goldens; never regenerate in CI)
        run: uv run --project parity --frozen python parity/run_parity.py --strict
