name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No .py under tests/
        run: |
          if find tests -name '*.py' | grep -q .; then
            echo "Hard-rule violation: .py file under tests/" >&2
            find tests -name '*.py' >&2
            exit 1
          fi

      - name: No pandas/scipy in src/ or tests/
        run: |
          if grep -rE 'pandas\.|scipy\.|import pandas|import scipy' src tests 2>/dev/null; then
            echo "Hard-rule violation: external oracle reference in Chelis source" >&2
            exit 1
          fi

  chelis-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.4 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.4-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.2.4"

      - name: Populate reef registry
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          COMPILER_PIN=$(grep '^compiler' reef.toml | sed 's/.*"\(.*\)"/\1/')
          mkdir -p /tmp/reef-deps/chelis-std /tmp/reef-deps/nautilus
          tar -xf deps/chelis-std-0.1.0.tar.zst -C /tmp/reef-deps/chelis-std
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/chelis-std/reef.toml
          chelis reef publish /tmp/reef-deps/chelis-std
          gh release download v0.2.2 \
            --repo Chelis-Lang/nautilus \
            --pattern 'nautilus-0.2.2.tar.zst' \
            --dir /tmp/reef-deps/nautilus-dl
          tar -xf /tmp/reef-deps/nautilus-dl/nautilus-0.2.2.tar.zst \
            -C /tmp/reef-deps/nautilus
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/nautilus/reef.toml
          chelis reef publish /tmp/reef-deps/nautilus

      - name: reef build
        run: chelis reef build

      - name: chelis test tests/
        run: |
          # Run sequentially to avoid OOM (each test compiles a fresh subprocess).
          for f in tests/*.ch; do
            chelis test "$f"
          done

  pandas-parity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install pandas --quiet

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.2.4 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.2.4-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.2.4-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.2.4"

      - name: Populate reef registry
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          COMPILER_PIN=$(grep '^compiler' reef.toml | sed 's/.*"\(.*\)"/\1/')
          mkdir -p /tmp/reef-deps/chelis-std /tmp/reef-deps/nautilus
          tar -xf deps/chelis-std-0.1.0.tar.zst -C /tmp/reef-deps/chelis-std
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/chelis-std/reef.toml
          chelis reef publish /tmp/reef-deps/chelis-std
          gh release download v0.2.2 \
            --repo Chelis-Lang/nautilus \
            --pattern 'nautilus-0.2.2.tar.zst' \
            --dir /tmp/reef-deps/nautilus-dl
          tar -xf /tmp/reef-deps/nautilus-dl/nautilus-0.2.2.tar.zst \
            -C /tmp/reef-deps/nautilus
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/nautilus/reef.toml
          chelis reef publish /tmp/reef-deps/nautilus

      - name: reef build
        run: chelis reef build

      - name: static checks
        run: python scripts/run_static_checks.py

      - name: SKILL examples
        run: python scripts/run_skill_checks.py

      - name: mdBook examples
        run: python scripts/validate_book_examples.py

      - name: pandas parity
        run: python parity/run_parity.py --strict
